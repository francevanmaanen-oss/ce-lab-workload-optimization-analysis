name: Destroy Lab Infrastructure

on:
  push:
    branches:
      - destroy

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Download Terraform state
        id: download-state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: .

      - name: Skip if no state found
        if: steps.download-state.outcome == 'failure'
        run: |
          echo "## Nothing to destroy" >> $GITHUB_STEP_SUMMARY
          echo "No terraform-state artifact found — infrastructure may already be destroyed." >> $GITHUB_STEP_SUMMARY
          echo "NO_STATE=true" >> $GITHUB_ENV

      - name: Terraform Init
        if: env.NO_STATE != 'true'
        run: terraform init

      - name: Terraform Destroy
        if: env.NO_STATE != 'true'
        run: terraform destroy -auto-approve

      - name: Delete state artifact
        if: env.NO_STATE != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const stateArtifact = artifacts.data.artifacts.find(
              a => a.name === 'terraform-state'
            );
            if (stateArtifact) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: stateArtifact.id,
              });
              console.log('State artifact deleted.');
            } else {
              console.log('No state artifact found — already deleted.');
            }

      - name: Confirm destruction
        if: env.NO_STATE != 'true'
        run: |
          echo "## Lab Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All EC2 instances and EBS volumes have been removed." >> $GITHUB_STEP_SUMMARY
          echo "Free tier hours are no longer being consumed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Remember to also manually clean up Lambda, EventBridge, and IAM if not done yet." >> $GITHUB_STEP_SUMMARY
